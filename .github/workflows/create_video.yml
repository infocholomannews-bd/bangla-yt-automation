name: Create Custom Topic Video (Draft)

on:
  workflow_dispatch:
    inputs:
      topic:
        description: 'ভিডিওর বিষয় লিখুন (যেমন: বাংলাদেশের নতুন মেট্রোরেল রুট)'
        required: true
        type: string

jobs:
  generate-video:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install FFmpeg and Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install -r requirements.txt

      - name: Generate and Upload Video as Private
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          VIDEO_TOPIC: ${{ github.event.inputs.topic }}
        run: python main.py
